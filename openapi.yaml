tags:
- name: Health Check
  description: System status, broker readiness checks, and health monitoring endpoints.
- name: Event Broker
  description: Real-time session event dispatching and broadcasting across WebSocket
    connections.
- name: Technical Defense
  description: AI-driven technical defense question generation, real-time response
    grading, audio answer evaluation, and cumulative progress reporting.
- name: Debrief & Evaluation
  description: Post-defense debrief reports with STAR framework analysis, sub-scores,
    and coaching verdict.
- name: Voice & TTS
  description: AssemblyAI Voice Agent integration, bi-directional Speech-to-Speech
    agent, and text-to-speech audio synthesis.
