openapi: 3.1.0
info:
  title: Vivaguard Broker
  description: '

    # VivaGuard AI Backend Broker & Evaluation Engine


    VivaGuard provides a real-time AI copilot, speech evaluation engine, and adaptive
    technical interview defense system.


    ## Key Capabilities:

    - **AssemblyAI Realtime Speech-to-Text**: Stream 16 kHz audio via WebSockets for
    real-time transcription.

    - **AssemblyAI Voice Agent (TTS & Speech-to-Speech)**: Convert AI coaching feedback
    and text into audio responses and stream bi-directional voice agent conversations
    over WebSockets (`/ws/speech-to-speech`).

    - **Gemini / LLM Evaluation Engine**: Analyze answers against technical rubrics,
    filler words, and domain depth.

    - **Session Event Broker**: Low-latency WebSocket event distribution across client
    connections.

    - **Adaptive Difficulty Engine**: Dynamically adjust question difficulty tier
    (Junior, Mid-Level, Senior) based on candidate performance.


    ## Interactive API Documentation

    - **Swagger UI**: [/docs](http://localhost:8000/docs)

    - **ReDoc**: [/redoc](http://localhost:8000/redoc)

    - **OpenAPI Schema (JSON)**: [/openapi.json](http://localhost:8000/openapi.json)

    '
  contact:
    name: VivaGuard Engineering
    url: https://vivaguard.ai/
  license:
    name: MIT License
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health Check
      summary: Service Health Check
      description: Returns backend broker status and service readiness for health
        checks.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/route:
    post:
      tags:
      - Event Broker
      summary: Route Live Session Event
      description: Routes a real-time event (audio, transcript, status, error) to
        active session WebSocket connections.
      operationId: route_event_api_v1_route_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerEvent'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/debrief:
    post:
      tags:
      - Debrief & Evaluation
      summary: Generate Post-Defense Session Debrief Report
      description: Analyzes full transcript and session history to produce a comprehensive
        STAR framework debrief report with sub-scores and verdict.
      operationId: debrief_endpoint_api_debrief_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebriefRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebriefResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
