components:
  schemas:
    AudioEvaluateRequest:
      properties:
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Optional session id to broadcast grade event
          example: session-456
        question_id:
          type: integer
          title: Question Id
          description: Question ID
          default: 1
          example: 1
        question_text:
          type: string
          title: Question Text
          description: Target question text
          example: Explain database sharding.
        evaluation_criteria:
          items:
            type: string
          type: array
          title: Evaluation Criteria
          description: Evaluation criteria list
          example:
          - Explains hash sharding vs range sharding
        audio_base64:
          type: string
          title: Audio Base64
          description: Base64 encoded audio string (webm/mp3/wav/m4a)
        difficulty_level:
          type: string
          title: Difficulty Level
          description: Baseline difficulty level
          default: junior
          example: junior
        adaptive_mode:
          type: boolean
          title: Adaptive Mode
          description: Adaptive mode enabled
          default: true
          example: true
      type: object
      required:
      - question_text
      - audio_base64
      title: AudioEvaluateRequest
    Body_evaluate_test_audio_api_v1_interview_evaluate_audio_post:
      properties:
        audio_file:
          type: string
          format: binary
          title: Audio File
        question_id:
          type: integer
          title: Question Id
          default: 1
        question_text:
          type: string
          title: Question Text
        evaluation_criteria:
          type: string
          title: Evaluation Criteria
          default: '[]'
        difficulty_level:
          type: string
          title: Difficulty Level
          default: junior
        adaptive_mode:
          type: boolean
          title: Adaptive Mode
          default: true
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      type: object
      required:
      - audio_file
      - question_text
      title: Body_evaluate_test_audio_api_v1_interview_evaluate_audio_post
    Body_evaluate_test_audio_api_v1_test_interview_evaluate_audio_post:
      properties:
        audio_file:
          type: string
          format: binary
          title: Audio File
        question_id:
          type: integer
          title: Question Id
          default: 1
        question_text:
          type: string
          title: Question Text
        evaluation_criteria:
          type: string
          title: Evaluation Criteria
          default: '[]'
        difficulty_level:
          type: string
          title: Difficulty Level
          default: junior
        adaptive_mode:
          type: boolean
          title: Adaptive Mode
          default: true
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      type: object
      required:
      - audio_file
      - question_text
      title: Body_evaluate_test_audio_api_v1_test_interview_evaluate_audio_post
    BrokerEvent:
      properties:
        event_id:
          type: string
          title: Event Id
          description: Unique UUID or string identifying the event
          example: evt-98765
        session_id:
          type: string
          title: Session Id
          description: Target session ID for live WebSocket client broadcasting
          example: session-123
        type:
          type: string
          enum:
          - audio
          - transcript
          - tool_call
          - status
          - error
          title: Type
          description: Category type of the broker event
          example: transcript
        payload:
          type: object
          title: Payload
          description: Event payload dictionary passed to subscribers
          example:
            final: true
            text: Hello VivaGuard
      type: object
      required:
      - event_id
      - session_id
      - type
      title: BrokerEvent
    BrokerResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          description: Indicates whether the event routing succeeded
          default: true
          example: true
        message:
          type: string
          title: Message
          description: Status message detailing routing execution
          default: Event routed
          example: Event routed
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Id
          description: Event ID that was dispatched
          example: evt-98765
      type: object
      title: BrokerResponse
    CriticalShiftSchema:
      properties:
        timestamp_sec:
          type: number
          title: Timestamp Sec
          description: Timestamp in seconds when key signal shift occurred
        signal:
          type: string
          title: Signal
          description: 'Signal level: GREEN, AMBER, or RED'
        spoken_phrase:
          type: string
          title: Spoken Phrase
          description: Spoken phrase or coaching nudge at signal shift
        coaching_feedback:
          type: string
          title: Coaching Feedback
          description: Actionable coaching feedback provided to candidate
      type: object
      required:
      - timestamp_sec
      - signal
      - spoken_phrase
      - coaching_feedback
      title: CriticalShiftSchema
    DebriefRequest:
      properties:
        ground_truth:
          type: string
          title: Ground Truth
          description: Target ground truth answer facts or ideal rubric criteria
          default: ''
          example: LSM tree buffer flushing uses sequential log writes to optimize
            throughput.
        target_question:
          type: string
          title: Target Question
          description: Main topic question asked during the defense session
          default: ''
          example: How does LSM tree buffering minimize disk write amplification?
        full_transcript:
          type: string
          title: Full Transcript
          description: Complete transcript of candidate spoken responses throughout
            session
          default: ''
          example: I implemented a log-structured merge tree with sequential append
            buffers...
        history:
          items:
            type: object
          type: array
          title: History
          description: List of real-time evaluation events captured during session
      type: object
      title: DebriefRequest
    DebriefResponse:
      properties:
        overall_score:
          type: integer
          title: Overall Score
          description: Overall defense score (0-100)
          example: 85
        clarity_score:
          type: integer
          title: Clarity Score
          description: Clarity and delivery sub-score (0-100)
          example: 88
        confidence_score:
          type: integer
          title: Confidence Score
          description: Poise and vocal confidence sub-score (0-100)
          example: 82
        technical_depth_score:
          type: integer
          title: Technical Depth Score
          description: Technical depth and accuracy sub-score (0-100)
          example: 86
        green_percentage:
          type: integer
          title: Green Percentage
          description: Percentage of GREEN signals recorded
          example: 75
        amber_percentage:
          type: integer
          title: Amber Percentage
          description: Percentage of AMBER signals recorded
          example: 20
        red_percentage:
          type: integer
          title: Red Percentage
          description: Percentage of RED signals recorded
          example: 5
        total_fillers:
          type: integer
          title: Total Fillers
          description: Total count of filler words detected (e.g. um, uh, like)
          example: 2
        total_technical_keywords:
          type: integer
          title: Total Technical Keywords
          description: Total count of domain technical keywords mentioned
          example: 6
        dodged_questions_count:
          type: integer
          title: Dodged Questions Count
          description: Count of questions dodged or answered vaguely
          example: 0
        total_duration_sec:
          type: number
          title: Total Duration Sec
          description: Total defense session duration in seconds
          example: 180.5
        ideal_star_answer:
